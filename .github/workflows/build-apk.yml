name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9 (with retries and mirrors)
        shell: bash
        run: |
          ok=0
          for i in 1 2 3 4; do
            for u in https://services.gradle.org/distributions/gradle-8.9-bin.zip https://downloads.gradle.org/distributions/gradle-8.9-bin.zip https://github.com/gradle/gradle-distributions/releases/download/v8.9.0/gradle-8.9-bin.zip; do
              if curl -fsSL --retry 2 -o /tmp/gradle.zip "$u" && unzip -tq /tmp/gradle.zip >/dev/null 2>&1; then ok=1; break 2; fi
              echo "failed: $u"
            done
            sleep $((i*15))
          done
          if [ $ok = 1 ]; then sudo unzip -q /tmp/gradle.zip -d /opt && echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"; else echo "using preinstalled gradle"; gradle --version | head -5; fi
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleRelease > build.log 2>&1
          rc=$?
          grep -E "error:|error |FAILED|What went wrong|ninja:|CMake Error|undefined|Execution failed" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: SynthKeyboard-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to apk-out branch
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/release/app-release.apk /tmp/out/SynthKeyboard.apk
          cd /tmp/out && git init -q && git checkout -q -b apk-out
          git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm apk
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-out
