name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug > build.log 2>&1
          rc=$?
          grep -E "error:|error |FAILED|What went wrong|ninja:|CMake Error|undefined|Execution failed" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: SynthKeyboard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
