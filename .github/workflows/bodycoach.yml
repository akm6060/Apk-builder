name: Build BodyCoach 3D APK
on:
  push:
    branches: [ "bodycoach" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease 2>&1 | tee build.log
      - name: Verify
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" | head -4
          ls -la "$APK"
      - name: Publish APK to bodycoach-apk branch
        if: always()
        run: |
          mkdir out && cd out
          git init -q -b bodycoach-apk
          git config user.name "apk-bot"; git config user.email "apk-bot@users.noreply.github.com"
          if [ -f ../app/build/outputs/apk/release/app-release.apk ]; then cp ../app/build/outputs/apk/release/app-release.apk BodyCoach3D.apk; fi
          tail -n 200 ../build.log > build-log.txt || true
          echo "${GITHUB_SHA}" > source-commit.txt
          git add -A && git commit -qm "APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" bodycoach-apk
