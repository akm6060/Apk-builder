name: Build HTML to APK Converter

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -o -q converter-src.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Build template app
        run: gradle --no-daemon :template:assembleDebug

      - name: Put template inside converter
        run: |
          mkdir -p app/src/main/assets
          cp template/build/outputs/apk/debug/template-debug.apk app/src/main/assets/template.apk
          unzip -l app/src/main/assets/template.apk

      - name: Build converter app
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload converter APK
        uses: actions/upload-artifact@v4
        with:
          name: HtmlToApkConverter
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Self-test (generate a sample app)
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Verify sample app
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=app/build/test-output/sample-app.apk
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | head -n 8
          "$BT/aapt2" dump badging "$APK" | grep -q "package: name='com.htmlapk.sample'"
          "$BT/zipalign" -c -p 4 "$APK" && echo "Alignment OK"

      - name: Upload sample app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SampleGeneratedApp
          path: app/build/test-output/sample-app.apk
          if-no-files-found: ignore
