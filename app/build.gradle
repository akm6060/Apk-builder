plugins { id 'com.android.application' }
def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer
android {
    namespace 'com.synthkeyboard.app'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.synthkeyboard.app'
        minSdk 24
        targetSdk 35
        versionCode 300 + runNo
        versionName '4.0.' + runNo
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildFeatures { prefab true }
    signingConfigs {
        debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'html' }
}
dependencies {
    implementation 'com.google.oboe:oboe:1.9.0'
}
